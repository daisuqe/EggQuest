<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="author" content="daisuqe">
<meta name="copyright" content="Copyright (c) 2026 daisuqe. All rights reserved.">
<title>EGG QUEST</title>
<!-- アイコン: 1枚(180x180、約1KB)で、ブラウザのタブ(favicon)と iPhone のホーム画面の両方に使う -->
<link rel="icon" type="image/png" href="icon.png">
<link rel="apple-touch-icon" href="icon.png">
<meta name="apple-mobile-web-app-title" content="EGG QUEST">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<style>
  /* 美咲ゴシック(ドットフォント)。8px の倍数で使うとくっきり表示される */
  @font-face { font-family: 'Misaki'; src: url('fonts/misaki_gothic.woff2') format('woff2'); font-display: block; }
  /* Yodaka(オリジナルのドットフォント): 英字・数字・記号だけに使う。1ドット = 70/1000em なので、
     size-adjust で 16px のとき 1ドット = 1px になるようにしてある(16px の倍数で使うとくっきり出る) */
  @font-face { font-family: 'Yodaka'; src: url('fonts/yodaka.woff') format('woff'); font-display: block; size-adjust: 89.2857%;
               unicode-range: U+0020-007E, U+00A0-00FF, U+2010-206F, U+20AC, U+2100-21FF, U+2200-22FF, U+25A0-25FF, U+2600-27BF, U+FF01-FF5E; }
  :root { --font:'Yodaka', 'Misaki', sans-serif; }   /* 文字の書体(日本語以外は、美咲ゴシックを使わない: lang.js が変える) */
  body { margin:0; background:#14161c; color:#dde; font-family:var(--font); display:flex; justify-content:center; padding:20px;
         -webkit-font-smoothing: none; font-smooth: never; }
  #wrap { display:flex; flex-direction:column; align-items:center; gap:12px; }   /* 下のエリアは中身の幅のまま(上の表示はその幅に合わせる) */
  #main { display:flex; flex-direction:row-reverse; gap:16px; align-items:flex-start; }   /* 右の欄(情報・アイテム)は左、盤面は右 */
  #field { display:block; }
  canvas { background:#0b0c10; border:4px solid #d8dbe2; }   /* 盤面・上の戦闘画面・NEXT の枠は、白に近いグレー */
  #side { width:200px; font-size:16px; line-height:1.25; }
  /* ステージ・スコア・NEXT の文字は2倍(32px、数字は64px) */
  .stat { font-size:32px; margin:4px 0 6px; } .stat b { font-size:64px; font-weight:normal; line-height:1; }
  #stage { font-size:112px; }   /* ステージの番号は大きく(64px の約1.8倍。ドットがくっきり出る 16 の倍数) */
  .label { font-size:32px; margin-top:6px; }
  #next { margin:6px 0 4px; border-radius:14px; cursor:pointer; touch-action:none; }   /* NEXT の枠は角丸。タップで入れかえ */
  /* ボスの情報(角丸の枠) */
  /* カードは右の欄の幅の9割(文字はドットフォントがくっきり出る16pxのまま) */
  #boss { width:200px; box-sizing:border-box; margin-top:10px; padding:7px 9px; border:2px solid #5a5f70; border-radius:9px; background:#1b1d25; }
  #boss .en { font-size:16px; color:#fff; }
  #boss .ja { display:none; }   /* 2行目の名前は出さない(名前は1行: 日本語はカタカナ、ほかは英語) */
  #boss canvas { display:block; margin:6px auto; background:#0b0c10; border:1px solid #333845; image-rendering:pixelated; }
  #boss .row { font-size:16px; margin:2px 0; }
  #boss .attr { display:inline-block; padding:0 3px; color:#111; border-radius:3px; }
  #boss.none { visibility:hidden; }   /* 敵がいないときは、カードを出さない(場所はそのまま空けておく) */
  /* アイテム(月の杖・ポーションの瓶): ボスのカードの下。タップで使う */
  #items { width:200px; display:flex; flex-direction:column; align-items:center; gap:6px; margin-top:2px; }
  #items .slot { position:relative; }
  #items canvas.item { display:block; background:none; border:none; cursor:pointer; touch-action:none; }
  /* PC: ショートカットキー(ボタンの真ん中に白い字で。読みやすいように黒いふち) */
  #items .key { position:absolute; inset:0; display:flex; align-items:center; justify-content:center; pointer-events:none;
               font-size:32px; line-height:1; color:#fff; white-space:nowrap;
               text-shadow:-3px 0 #000, 3px 0 #000, 0 -3px #000, 0 3px #000, -2px -2px #000, 2px -2px #000, -2px 2px #000, 2px 2px #000; }
  body.touchdev #items .key { display:none; }   /* スマホでは、キーの表示はいらない */
  /* スマホ用のボタン(指で操作する端末だけ出す) */
  /* スマホの画面ボタン(PartlyRainy と同じ): 上段 ◀ ▶ 左回転 右回転 / 下段 ▼ ≫(ハードドロップ)。画面の下に固定 */
  #pad { display:none; position:fixed; left:0; right:0; bottom:0; z-index:3; padding:8px 10px calc(10px + env(safe-area-inset-bottom));
         grid-template-columns:repeat(8,1fr); gap:8px; background:rgba(0,0,0,.25); user-select:none; -webkit-user-select:none; }
  body.touchdev:not(.flick) #pad { display:grid; }   /* ボタン操作のときだけ出す */
  #pad .grp { display:contents; }
  #pad button { display:flex; align-items:center; justify-content:center; color:#fff; background:rgba(10,12,17,.72); border:2px solid #fff;
                border-radius:12px; height:84px; padding:0; touch-action:none; -webkit-tap-highlight-color:transparent; }
  #pad button svg { width:68px; height:68px; pointer-events:none; }
  #pad button:active, #pad button.on { background:rgba(70,130,255,.75); }
  #pad [data-act="left"]  { grid-column:1 / 3; grid-row:1; }
  #pad [data-act="right"] { grid-column:3 / 5; grid-row:1; }
  #pad [data-act="rotL"]  { grid-column:5 / 7; grid-row:1; }
  #pad [data-act="rotR"]  { grid-column:7 / 9; grid-row:1; }
  #pad [data-act="soft"]  { grid-column:2 / 4; grid-row:2; }   /* ◀▶の下 */
  #pad [data-act="hard"]  { grid-column:6 / 8; grid-row:2; }   /* 左右回転の下 */
  #menu { display:none; position:fixed; inset:0; align-items:center; justify-content:center; background:rgba(8,10,16,0.7); z-index:5;
          touch-action:none; user-select:none; -webkit-user-select:none; }
  #menu.open { display:flex; }
  #menu .panel { min-width:240px; padding:16px 20px 20px; border:2px solid #5a5f70; border-radius:12px; background:#1b1d25; }
  #menu .title { font-size:16px; color:#ffe27a; text-align:center; margin-bottom:12px; }
  #menu .list { display:flex; flex-direction:column; gap:10px; }
  #menu button { height:48px; font-family:var(--font); font-size:16px; color:#dde; background:#262a36;
                 border:2px solid #4a5062; border-radius:10px; padding:0 16px; cursor:pointer; touch-action:none; }
  #menu button.sel { border-color:#ffe27a; color:#fff; }
  #field { cursor:pointer; border-radius:18px; }   /* 上の戦闘画面の枠は角丸 */
  /* PC: 右上のメニューボタン(PartlyRainy と同じ形)。スマホでは出さない(上の画面をタップで開く) */
  #menuBtn { position:fixed; top:12px; right:12px; z-index:3; font-family:var(--font); font-size:32px; letter-spacing:.08em;
             color:var(--menuFg, #e9ecf1); background:var(--menuBg, #0a0c11); border:2px solid var(--menuEdge, #fff);   /* 色は背景を7割まぜて控えめに(game.js) */
             border-radius:12px; padding:14px 26px 12px; cursor:pointer; }
  #menuBtn:hover { color:#e9ecf1; background:#0a0c11; border-color:#fff; }   /* マウスを乗せたときは、くっきり */
  body.touchdev #menuBtn { display:none; }
  #menu .help { margin-bottom:14px; font-size:16px; line-height:1.5; }
  #menu .help .row { display:flex; gap:12px; }
  #menu .help .k { color:#ffe27a; min-width:9em; }
  #menu .help .note { color:#9aa3b8; margin-top:6px; }
  #menu .help:empty { display:none; }
  /* ずかん */
  #menu .zk-cards { display:flex; gap:8px; }
  #menu .zk-card { flex:1; aspect-ratio:533 / 800; border:2px solid #ffe27a; border-radius:8px; overflow:hidden; background:#fdf2ee; cursor:pointer; }
  #menu .zk-card img { width:100%; height:100%; object-fit:cover; display:block; }
  #menu .zk-card.locked { border-color:#3a4052; background:#232633; color:#6a7288; display:flex; align-items:center; justify-content:center;
                          text-align:center; font-size:12px; line-height:1.4; padding:6px; box-sizing:border-box; cursor:default; }
  #menu .zk-grid { display:grid; grid-template-columns:repeat(auto-fill, minmax(84px, 1fr)); gap:6px; }
  #menu .zk-cell { background:#232633; border:1px solid #3a4052; border-radius:8px; padding:6px 4px 4px; text-align:center; }
  #menu .zk-cell img { width:60px; height:60px; object-fit:contain; image-rendering:pixelated; display:block; margin:0 auto 3px; }
  #menu .zk-name { font-size:11px; line-height:1.3; color:#dde; word-break:break-word; }
  #menu .zk-name.boss { color:#ffe27a; }
  #menu .help.zk { width:min(460px, calc(100vw - 80px)); }
  #menu .zk-attr { font-size:11px; line-height:1.5; color:#9fb0cc; margin-top:2px; }
  #menu .zk-attr .attr { display:inline-block; padding:0 3px; color:#111; border-radius:3px; margin:1px 0; }
  #menu .zk-wl { margin-right:2px; }
  #menu .zk-name .attr { display:inline-block; padding:0 3px; color:#111; border-radius:3px; }
  /* カードを大きく見る(タップで閉じる) */
  #cardView { display:none; position:fixed; inset:0; z-index:50; background:rgba(0,0,0,.88); align-items:center; justify-content:center; cursor:pointer; }
  #cardView.open { display:flex; }
  #cardView img { max-width:94vw; max-height:94vh; border-radius:12px; box-shadow:0 0 24px rgba(255,226,122,.5); }
  /* 確認のメッセージ(読みやすい普通の書体で) */
  #menu .help .confirm { font-family:system-ui, -apple-system, 'Hiragino Sans', 'Yu Gothic UI', Meiryo, sans-serif; font-size:16px; line-height:1.6; color:#fff; max-width:22em; }
  /* あそびかた: 普通の書体で読みやすく(ドット文字にしない) */
  #menu .help.doc { font-family:system-ui, -apple-system, 'Hiragino Sans', 'Yu Gothic UI', Meiryo, sans-serif; font-size:15px; line-height:1.6;
                    max-height:min(62vh, 520px); overflow:auto; touch-action:pan-y; text-align:left; }
  #menu .help.doc .h { color:#ffe27a; font-weight:bold; margin:12px 0 4px; border-bottom:1px solid #3a4052; }
  #menu .help.doc .h:first-child { margin-top:0; }
  #menu .help.doc .note { color:#dde; margin-top:2px; }
  #menu .help.doc .row { column-gap:10px; row-gap:0; }
  #menu .help.doc .k { min-width:8em; }
  /* ランキング(登録・一覧) */
  #menu .rstat { display:grid; grid-template-columns:auto 1fr; gap:4px 14px; margin-bottom:12px; }
  #menu .rstat b { color:#fff; font-weight:normal; text-align:right; }
  #menu .rlabel { margin:4px 0; color:#ffe27a; }
  #menu #rankName { width:100%; box-sizing:border-box; font-family:var(--font); font-size:16px; padding:10px 12px; color:#fff;
                    background:rgba(255,255,255,.08); border:2px solid #6b7894; border-radius:8px; outline:none; user-select:text; -webkit-user-select:text; }
  #menu .rmsg { margin:8px 0; color:#ffd479; min-height:1.4em; }
  #menu .rlist { max-height:min(56vh, 420px); overflow:auto; touch-action:pan-y; }
  #menu .rlist table { width:100%; border-collapse:collapse; }
  #menu .rlist th { color:#9aa3b8; font-weight:normal; text-align:left; padding:2px 6px; }
  #menu .rlist td { padding:4px 6px; border-bottom:1px solid #2c3550; white-space:nowrap; }
  #menu .rlist td:first-child { color:#9fb4e8; text-align:right; }
  #menu .rlist td:last-child, #menu .rlist th:last-child { text-align:right; color:#fff; }
  #menu .rlist tr.me td { background:rgba(70,130,255,.28); }
  #menu .panel { max-width:min(520px, calc(100vw - 32px)); box-sizing:border-box; }
  @media (max-width: 520px) {   /* せまい画面では、操作と動きを2行に */
    #menu .help .row { flex-direction:column; gap:0; margin-bottom:4px; }
    #menu .help .v { padding-left:1em; }
  }
  /* タイトル画面 */
  #title { position:fixed; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:18px;
           background:radial-gradient(ellipse at 50% 35%, #2a2140 0%, #14161c 70%); z-index:4; user-select:none; -webkit-user-select:none; touch-action:none; }
  #title.hide { display:none; }
  #title canvas { display:block; background:none; border:none; }
  #title #titleBg { position:absolute; inset:0; width:100%; height:100%; pointer-events:none; }   /* 星空(画面全体) */
  #title #titleCv, #title .list, #title .hint { position:relative; }
  #title .list { display:grid; grid-template-columns:1fr 1fr; gap:12px; width:min(400px, calc(100vw - 32px)); }   /* 2列 */
  #title .list button.wide { grid-column:1 / 3; }   /* 「つづきから」がないときのスタートは横いっぱい */
  #title button { min-width:0; padding:0 6px; white-space:nowrap; overflow:hidden; height:56px; font-family:var(--font); font-size:32px; color:#dde; background:#262a36;
                  border:2px solid #4a5062; border-radius:12px; cursor:pointer; touch-action:none; }
  #title button.sel { border-color:#ffe27a; color:#fff; background:#30344a; }
  #title .hint { font-size:16px; color:#8890a0; }
  /* タイトルの右上: アプリ一覧へのボタン(16x16 のドット絵を 32px に。背景・枠なし) */
  #title #appsBtn { position:absolute; top:max(14px, env(safe-area-inset-top)); right:max(14px, env(safe-area-inset-right)); z-index:1;
                    width:32px; height:32px; padding:0; margin:0; background:none; border:none; border-radius:4px; opacity:.7; cursor:pointer;
                    touch-action:manipulation; -webkit-tap-highlight-color:transparent; }
  #title #appsBtn:hover { opacity:1; }
  /* タイトルの一番下: 著作権の表示(小さく薄く)。押すと License の画面 */
  #title #copyBtn { position:absolute; left:50%; transform:translateX(-50%); bottom:max(6px, env(safe-area-inset-bottom)); z-index:1; white-space:nowrap; height:auto; min-width:0;
                    padding:2px 6px; margin:0; background:none; border:none; border-radius:4px; cursor:pointer; touch-action:manipulation;
                    font-family:system-ui, -apple-system, 'Hiragino Sans', 'Yu Gothic UI', Meiryo, sans-serif; font-size:11px; line-height:14px;
                    color:rgba(221,221,238,.42); -webkit-tap-highlight-color:transparent; }
  #title #copyBtn:hover { color:rgba(221,221,238,.75); }
  #title #copyBtn:focus-visible { outline:2px solid #fff; outline-offset:1px; color:rgba(221,221,238,.9); }
  /* 高さの低い画面(横向きの小さい画面など): タイトルのボタンを少し詰めて、著作権の表示と重ならないように */
  @media (max-height: 520px) {
    #title { gap:8px; }
    #title .list { gap:8px; }
    #title .list button { height:40px; font-size:24px; }
  }
  /* キー・コントローラー設定(PC だけ) */
  #menu .help.doc .crow { display:flex; align-items:center; justify-content:space-between; gap:8px; margin:4px 0; }
  #menu .help.doc .crow .cl { color:#dde; }
  #menu .cfg-slots { display:flex; gap:6px; flex:none; }
  #menu .cfg-slot, #menu .cfg-def { font-family:system-ui, -apple-system, 'Hiragino Sans', 'Yu Gothic UI', Meiryo, sans-serif; font-size:13px; color:#d3d8e0;
                                    background:#262a36; border:2px solid #4a5062; border-radius:8px; height:30px; cursor:pointer; padding:0 6px; white-space:nowrap; }
  #menu .cfg-slot { width:118px; overflow:hidden; text-overflow:ellipsis; }
  #menu .cfg-slot.cap { background:#2f6dff; color:#fff; border-color:#8fb2ff; }
  #menu .help button.sel { border-color:#ffe27a; color:#fff; }
  #menu .cdef { display:flex; justify-content:flex-end; margin:6px 0 0; }
  #menu .cfg-note { margin:4px 0 0; font-size:12px; line-height:1.5; color:#9fb0cc; }
  #menu .cfg-note.warn { color:#ffb86b; }
  #menu .rstat .rhard { color:#ff5a5a; }   /* 登録画面: むずかしいの印 */
  /* むずかしいで遊んでいるときの印(STAGE の横) */
  #hardMark { color:#ff5a5a; font-size:16px; vertical-align:middle; }
  /* License の文章 */
  #menu .help.doc .lic { white-space:pre-wrap; font-size:13px; line-height:1.7; color:#dde; }
  #title #appsBtn:focus-visible { outline:2px solid #fff; outline-offset:3px; opacity:1; }
  #title #appsBtn canvas { display:block; width:32px; height:32px; image-rendering:pixelated; image-rendering:crisp-edges; }
  /* アプリ一覧へ移動する確認 */
  #appsDlg { display:none; position:fixed; inset:0; z-index:60; background:rgba(0,0,0,.5); align-items:center; justify-content:center; padding:16px; box-sizing:border-box; }
  #appsDlg.open { display:flex; }
  #appsDlg .panel { width:min(380px, 100%); box-sizing:border-box; padding:20px 18px 18px; background:rgba(10,12,17,.9); border:1px solid #4a5570; border-radius:10px;
                    color:#d6dae2; text-align:center; }
  #appsDlg .msg { white-space:pre-line; font-family:system-ui, -apple-system, 'Hiragino Sans', 'Yu Gothic UI', Meiryo, sans-serif; font-size:16px; line-height:1.7; margin-bottom:16px; }
  #appsDlg .btns { display:flex; justify-content:center; gap:14px; }
  #appsDlg .btns button { width:110px; height:36px; box-sizing:border-box; padding:0; font-family:var(--font); font-size:20px; color:#dde; background:#262a36;
                          border:2px solid #4a5062; border-radius:10px; cursor:pointer; outline:none; }
  #appsDlg .btns button.sel { border-color:#ffe27a; color:#fff; background:#30344a; }
  body.touchdev #title .hint { display:none; }
  #rotate { display:none; position:fixed; inset:0; align-items:center; justify-content:center; background:#14161c;
            font-size:16px; text-align:center; line-height:2; z-index:10; }
  @media (pointer: coarse) {
    body { padding:4px; touch-action:none; overscroll-behavior:none; }
  }
  /* スマホは縦画面専用: 横にしたときはお願いを出す */
  @media (pointer: coarse) and (orientation: landscape) {
    #rotate { display:flex; }
  }
</style>
</head>
<body>
<div id="wrap">
  <canvas id="field" width="625" height="150"></canvas>
  <div id="main">
  <canvas id="board" width="300" height="600"></canvas>
  <div id="side">
    <div class="stat">STAGE <b id="stage">1</b> <span id="hardMark" style="display:none">HARD</span></div>
    <div class="stat">SCORE<br><b id="score">0</b></div>
    <div class="label">NEXT</div>
    <canvas id="next" width="192" height="192"></canvas>
    <div id="boss" class="none">
      <div class="en" id="bossEn">-</div>
      <div class="ja" id="bossJa"></div>
      <canvas id="bossImg" width="178" height="140"></canvas>
      <div class="row"><span data-i18n="cAttr">特性:</span><span id="bossAttr"></span></div>
      <div class="row"><span data-i18n="cWeak">弱点:</span><span id="bossWeak"></span></div>
      <div class="row"><span data-i18n="cHp">体力:</span><span id="bossHp"></span></div>
      <div class="row"><span data-i18n="cAtk">攻撃力:</span><span id="bossAtk"></span></div>
    </div>
    <!-- ルネリアのアイテム: 月の杖(満タンでタップ=月光波)と、ポーションの瓶(タップ=体力回復) -->
    <div id="items">
      <div class="slot"><canvas id="moonItem" class="item" width="196" height="196"></canvas><div class="key">V / Enter</div></div>
      <div class="slot"><canvas id="potionItem" class="item" width="196" height="196"></canvas><div class="key">C / +</div></div>
    </div>
  </div>
  </div>
</div>
<button id="menuBtn" type="button">MENU</button>   <!-- PC: 右上のメニューボタン -->
<div id="pad">
  <div class="grp l">
    <button type="button" data-act="left" aria-label="Move left"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M16.5 4 L6 12 L16.5 20 Z" fill="currentColor"/></svg></button>
    <button type="button" data-act="right" aria-label="Move right"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7.5 4 L18 12 L7.5 20 Z" fill="currentColor"/></svg></button>
    <button type="button" data-act="soft" aria-label="Drop"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7 L12 19 L20 7 Z" fill="currentColor"/></svg></button>
  </div>
  <div class="grp r">
